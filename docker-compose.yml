services:
  backend:
    image: 0cracker/todate-backend:latest
    container_name: todate-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET:-coolscretcoolscretcoolscretcoolscretcoolscret}
    volumes:
      - ./data:/app/data
    restart: always
