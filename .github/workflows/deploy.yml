name: CI/CD with Docker to AWS

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todate-backend:latest .

      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/todate-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy docker-compose files to AWS EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml docker-compose.prod.yml \
            ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }}:/home/${{ secrets.AWS_USERNAME }}/todate-backend/

      - name: Deploy to AWS EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} << 'ENDSSH'
          cd /home/${{ secrets.AWS_USERNAME }}/todate-backend
          
          echo "Creating .env file..."
          cat > .env << 'EOF'
          # Docker Hub
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          
          # PostgreSQL
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          
          # JWT
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_ACCESS_VALIDITY=${{ secrets.JWT_ACCESS_VALIDITY }}
          JWT_REFRESH_VALIDITY=${{ secrets.JWT_REFRESH_VALIDITY }}
          
          # Google OAuth
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          
          # Redis
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF
          
          echo "Logging in to Docker Hub..."
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          
          echo "Pulling latest images..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          
          echo "Stopping existing containers..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down
          
          echo "Starting new containers..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          
          echo "Waiting for services to be healthy..."
          sleep 10
          
          echo "Checking container status..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          
          echo "Cleaning up old images..."
          docker image prune -f
          
          echo "Deployment completed successfully!"
          ENDSSH
