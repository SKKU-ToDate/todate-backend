
server:
  port: 8080

spring:
  config:
    activate:
      on-profile: prod

  application:
    name: todate-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 개발 편의성을 위해 create-drop 유지 (운영 안정화 후 validate 권장)
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  auth:
    jwt:
      # JwtProps.java의 'secret' 필드
      secret: ${JWT_SECRET}

      access-valid: ${JWT_ACCESS_VALIDITY}

      refresh-valid: ${JWT_REFRESH_VALIDITY}

google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    root: INFO
