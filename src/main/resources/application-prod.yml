
server:
  port: 8080

spring:
  config:
    activate:
      on-profile: prod

  application:
    name: todate-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # H2를 사용하므로 validate 대신 update 또는 create-drop 사용
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  auth:
    jwt:
      # JwtProps.java의 'secret' 필드
      secret: ${JWT_SECRET}

      access-valid: ${JWT_ACCESS_VALIDITY}

      refresh-valid: ${JWT_REFRESH_VALIDITY}

google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    root: INFO
